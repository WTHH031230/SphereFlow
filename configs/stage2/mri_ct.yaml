# SphereFlow Stage 2 on MRI <-> CT: x0 = latent of the observed modality, x1 = target latent.
# Stage-1 RAE: shared DINOv2-B encoder + ViT-G decoders (scripts/train/mri_ct/), passed via --rae-path.
# Class-conditional DiTwDDTHead, num_classes=64 (class id = target * 16 + mask), no CFG.
# DiT^DH-XL: body dim=1152, heads=16, depth=28; head dim=2048, heads=16, depth=2.

stage_1:
  target: stage1.RAE
  params:
    encoder_cls: 'Dinov2withNorm'
    encoder_config_path: 'facebook/dinov2-with-registers-base'
    encoder_input_size: 224
    encoder_params:
      dinov2_path: 'facebook/dinov2-with-registers-base'
      normalize: true
    decoder_config_path: 'configs/decoder/ViTG'
    noise_tau: 0.0
    reshape_to_2d: true

stage_2:
  target: stage2.models.DDT.DiTwDDTHead
  params:
    input_size: 16
    patch_size: 1
    in_channels: 768
    hidden_size: [1152, 2048]
    depth: [28, 2]
    num_heads: [16, 16]
    mlp_ratio: 4.0
    num_classes: 64
    class_dropout_prob: 0.0
    use_qknorm: false
    use_swiglu: true
    use_rope: true
    use_rmsnorm: true
    wo_shift: false
    use_pos_embed: true

transport:
  params:
    path_type: 'Linear'
    prediction: 'velocity'
    loss_weight: null
    time_dist_type: 'logit-normal_0_1'

sampler:
  mode: ODE
  params:
    sampling_method: 'euler'
    num_steps: 50
    atol: 1.0e-6
    rtol: 1.0e-3
    reverse: false

guidance:
  method: 'cfg'
  scale: 1.0
  t_min: 0.0
  t_max: 1.0

misc:
  latent_size: [768, 16, 16]
  time_dist_shift_dim: 196608
  time_dist_shift_base: 4096

eval:
  eval_interval: 1000
  eval_model: false
  metrics: ['rfid', 'psnr', 'ssim', 'is']

training:
  epochs: 400
  global_batch_size: 384
  batch_size: 16
  grad_accum_steps: 1
  ema_decay: 0.9995
  num_workers: 8
  log_interval: 100
  checkpoint_interval: 4
  sample_every: 500
  clip_grad: 1.0
  global_seed: 42
  optimizer:
    lr: 2.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.0
  scheduler:
    type: linear
    warmup_epochs: 10
    decay_end_epoch: 400
    base_lr: 2.0e-4
    final_lr: 2.0e-5
    warmup_from_zero: false
